name: Preview Release

on:
  pull_request:
    types: [closed]
    branches:
      - "releases/preview*"
  workflow_dispatch: # Allow manual trigger for emergency releases

# Prevent concurrent preview releases
concurrency:
  # The timestamp-based version is only unique per minute, so serialize runs to avoid two runs stamping the same version number
  group: preview-release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write # enable GitHub OIDC token issuance for this job

env:
  DOTNET_VERSION: ${{ vars.DOTNET_VERSION }}
  BUILD_CONFIGURATION: "Release"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-and-publish-preview:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Cache NuGet packages for faster builds
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build MiCake.All.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run tests
        run: |
          dotnet test MiCake.All.sln \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "console;verbosity=minimal"

      - name: Get preview version number
        id: preview_version
        run: |
          # pull_request: GITHUB_BASE_REF is the target branch; dispatch: GITHUB_REF is the branch
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BRANCH_NAME="${GITHUB_BASE_REF#releases/}"
          else
            BRANCH_NAME="${GITHUB_REF#refs/heads/releases/}"
          fi

          # Extract version from branch name (format: preview-v1.0.0 or preview-1.0.0)
          if [[ "$BRANCH_NAME" =~ v?([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            echo "Extracted version from branch name: $MAJOR.$MINOR.$PATCH"
          else
            echo "Error: Cannot determine version from branch name '$BRANCH_NAME'. Ensure it follows 'releases/preview-vX.Y.Z' format."
            exit 1
          fi

          # Unique per minute: Major.Minor.Patch-preview.YYMMDDHHMM (e.g. 1.0.0-preview.2612121542)
          DATE_STAMP=$(date -u +%y%m%d%H%M)
          PREVIEW_VERSION="${MAJOR}.${MINOR}.${PATCH}-preview.${DATE_STAMP}"

          echo "version=${PREVIEW_VERSION}" >> $GITHUB_OUTPUT
          echo "::notice ::Preview version: ${PREVIEW_VERSION}"

      - name: Pack preview NuGet packages
        run: |
          dotnet pack MiCake.All.sln \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --no-build \
            --include-symbols \
            --include-source \
            -p:SymbolPackageFormat=snupkg \
            --output ./artifacts \
            -p:PackageVersion=${{ steps.preview_version.outputs.version }}

      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push preview packages to NuGet.org
        run: |
          for package in ./artifacts/*.nupkg; do
            echo "Pushing $package..."
            dotnet nuget push "$package" \
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Create preview release summary
        run: |
          echo "## 🚀 Preview Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`${{ steps.preview_version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${GITHUB_REF#refs/heads/}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${GITHUB_SHA::8}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Published Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for pkg in ./artifacts/*.nupkg; do
            pkgname=$(basename "$pkg" .nupkg)
            echo "- \`$pkgname\`" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Installation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "dotnet add package MiCake --version ${{ steps.preview_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload NuGet packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: preview-packages-${{ steps.preview_version.outputs.version }}
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
          retention-days: 30
