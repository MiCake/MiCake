name: Preview Release

on:
  pull_request:
    types: [closed]
    branches:
      - "releases/preview*"
  workflow_dispatch: # Allow manual trigger for emergency releases

# Prevent concurrent preview releases
concurrency:
  # Global group: the daily revision counter is shared across branches, so serialize all preview releases
  group: preview-release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # required to query today's workflow runs for the daily revision counter
  packages: write
  id-token: write # enable GitHub OIDC token issuance for this job

env:
  DOTNET_VERSION: ${{ vars.DOTNET_VERSION }}
  BUILD_CONFIGURATION: "Release"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-and-publish-preview:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Cache NuGet packages for faster builds
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build MiCake.All.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run tests
        run: |
          dotnet test MiCake.All.sln \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "console;verbosity=minimal"

      - name: Get preview version number
        id: preview_version
        run: |
          # Resolve branch name per trigger event:
          # - pull_request: GITHUB_REF is refs/pull/<n>/merge (unusable); GITHUB_BASE_REF holds the target branch name
          # - workflow_dispatch: GITHUB_REF is refs/heads/releases/preview-v1.0.0
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BRANCH_NAME="${GITHUB_BASE_REF#releases/}"
          else
            BRANCH_NAME="${GITHUB_REF#refs/heads/releases/}"
          fi

          # Try to extract version from branch name (format: preview-v1.0.0 or preview-1.0.0)
          if [[ "$BRANCH_NAME" =~ v?([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            echo "Extracted version from branch name: $MAJOR.$MINOR.$PATCH"
          else
            # throw error if version cannot be determined
            echo "Error: Cannot determine version from branch name '$BRANCH_NAME'. Ensure it follows 'releases/preview-vX.Y.Z' format."
            exit 1
          fi

          # Date stamp in YYMMDD format (e.g. 2026-12-12 -> 261212). Monotonic and human-readable.
          DATE_STAMP=$(date -u +%y%m%d)

          # Daily revision: count today's completed runs of this workflow, then +1.
          # Resets every day, mirroring the .NET SDK official build scheme (yyyymmdd.r).
          # Note: failed/cancelled runs count too, so the revision may skip numbers; that is fine.
          TODAY=$(date -u +%Y-%m-%dT00:00:00Z)
          WORKFLOW_FILE=$(basename "${GITHUB_WORKFLOW_REF%%@*}")
          RUNS_TODAY=$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs" \
            -f "created=>=${TODAY}" \
            -f "status=completed" \
            -f "per_page=1" \
            --jq '.total_count')
          REVISION=$((RUNS_TODAY + 1))

          # Format: Major.Minor.Patch-preview.YYMMDD.DailyRevision (e.g. 1.0.0-preview.261212.1)
          PREVIEW_VERSION="${MAJOR}.${MINOR}.${PATCH}-preview.${DATE_STAMP}.${REVISION}"

          echo "version=${PREVIEW_VERSION}" >> $GITHUB_OUTPUT
          echo "::notice ::Preview version: ${PREVIEW_VERSION}"

      - name: Pack preview NuGet packages
        run: |
          dotnet pack MiCake.All.sln \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --no-build \
            --include-symbols \
            --include-source \
            -p:SymbolPackageFormat=snupkg \
            --output ./artifacts \
            -p:PackageVersion=${{ steps.preview_version.outputs.version }}

      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push preview packages to NuGet.org
        run: |
          for package in ./artifacts/*.nupkg; do
            echo "Pushing $package..."
            dotnet nuget push "$package" \
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Create preview release summary
        run: |
          echo "## 🚀 Preview Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`${{ steps.preview_version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${GITHUB_REF#refs/heads/}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${GITHUB_SHA::8}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Published Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for pkg in ./artifacts/*.nupkg; do
            pkgname=$(basename "$pkg" .nupkg)
            echo "- \`$pkgname\`" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Installation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "dotnet add package MiCake --version ${{ steps.preview_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload NuGet packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: preview-packages-${{ steps.preview_version.outputs.version }}
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
          retention-days: 30
