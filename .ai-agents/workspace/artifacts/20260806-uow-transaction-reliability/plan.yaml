    notes: "实现+两轮修复完成：savepoint 委托、flush 前置事务、commit/rollback 终态状态机与 cleanup 传播、DI lifetime 启动验证；复审 0 Critical（Approve with comments）。Follow-up: W-1 FlushAsync 未封闭 terminal 状态（commit 后调用可触发 EF
      隐式事务，需在后续任务封闭）；W-2 ValidateDbContextLifetimes 缺 pooled 测试；S-1 反射注入测试脆弱、S-2 _preparedIsReadOnly 死字段、S-3 启动验证重复解析可合并"
    acceptance:
      - The same ambient frame and DbContext type always resolve the same context and resource instance
      - A context or resource bound to one live frame cannot be reused by another frame
      - Immediate mode resolves and activates every registered DbContext type without reflective best-effort probing
      - Scoped and supported pooled registrations pass validation; unsupported lifetimes and retrying strategies fail with context-specific diagnostics
      - Provider rollback and asynchronous disposal failures propagate to the UoW boundary
      - EF Core resource/context tests pass and dotnet build src/framework/MiCake.EntityFrameworkCore/MiCake.EntityFrameworkCore.csproj succeeds
    deliverables:
      freshness: current
