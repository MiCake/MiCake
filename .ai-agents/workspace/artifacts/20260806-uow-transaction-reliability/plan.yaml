  - id: t1-uow-runtime-contracts
    title: Rebuild provider-neutral UoW runtime
    status: done
    completed_at: 2026-08-06T06:35:17.379Z
    depends_on: []
    project:
      - default
    skill_hint: mvt-implement
    artifacts:
      files:
        - src/framework/MiCake/DDD/Uow/IUnitOfWork.cs
        - src/framework/MiCake/DDD/Uow/IUnitOfWorkManager.cs
        - src/framework/MiCake/DDD/Uow/IUnitOfWorkResource.cs
        - src/framework/MiCake/DDD/Uow/IStandaloneUnitOfWorkExecutor.cs
        - src/framework/MiCake/DDD/Uow/UnitOfWorkOptions.cs
        - src/framework/MiCake/DDD/Uow/UnitOfWorkCommitOutcome.cs
        - src/framework/MiCake/DDD/Uow/Internal/UnitOfWork.cs
        - src/framework/MiCake/DDD/Uow/Internal/UnitOfWorkManager.cs
        - src/framework/MiCake/DDD/Uow/Internal/AmbientUnitOfWorkAccessor.cs
        - src/framework/MiCake/DDD/Uow/Internal/StandaloneUnitOfWorkExecutor.cs
        - src/framework/MiCake/Modules/MiCakeEssentialModule.cs
        - src/tests/MiCake.Tests/Uow
        - src/tests/MiCake.Tests/Uow/UnitOfWorkReviewRegressionTests.cs
    notes: >
      Implement ADR-001, ADR-003, ADR-006, ADR-007, and ADR-011 in the provider-neutral MiCake package. Remove PersistenceStrategy, Timeout, IDbContextWrapper, and requiresNew boolean overloads; add
      explicit resource, flush, ambient-frame, standalone, partial-commit, event, and async-disposal contracts. Preserve shared nested rollback-only behavior and deterministic registration-order
      coordination without referencing EF Core.
    acceptance:
      - Every writable root UoW uses explicit resource transactions; read-only UoWs reject resource flush and write activation
      - FlushAsync activates and flushes resources in registration order without committing or raising commit events
      - Shared nested commit performs no physical commit, while nested rollback marks the root rollback-only
      - Partial commit and rollback failure expose per-resource outcomes and preserve all primary and cleanup exceptions
      - ExecuteRequiresNewAsync restores the previous ambient frame on success, failure, cancellation, commit failure, and rollback failure
      - Standalone execution rejects an existing ambient UoW and owns its async scope, UoW, commit, rollback, and disposal lifecycle
      - MiCake.Tests UoW tests pass and dotnet build src/framework/MiCake/MiCake.csproj succeeds
    deliverables:
      freshness: current
