    notes: t5 完成：实现 ADR-001 仓储契约（移除仓库持久化 API、DeleteByIdAsync tracked 生命周期删除、frame-stable 工厂透传、显式物理删除、分页全序）+ 独立复审修复（物理删除显式激活 UoW 事务、shadow/复合键 EF.Property 排序、无 UoW 契约测试重写）；EF Core 240/240、MiCake 260/260、构建
