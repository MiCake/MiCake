      - Sync writes either activate and bind synchronously or fail clearly when the provider cannot support the path
      - Multiple hosts in one process cannot overwrite or clear each other's interceptor configuration
      - Focused write coordinator/interceptor tests pass and the EF Core project builds cleanly
    deliverables:
