    notes: 实现 ADR-002 写守卫与命令绑定：EFCoreWriteCoordinator（无/只读 UoW 拒绝、帧稳定 wrapper、事务激活与绑定）、MiCakeDbCommandInterceptor（ExecuteSqlRaw/BulkUpdate/Migrations 分类实证修正）、SavingChanges 前置激活、DDL 无 UoW 放行；拦截器经 scope
      provider 解析；14 个新测试，EF Core 217/217、UoW 108/108、构建 0 警告；deliverables 已生成并标记 t5/t7 stale；待独立复审
