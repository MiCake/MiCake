        - src/tests/MiCake.Tests/DomainEventDispatchLifetime_Tests.cs
    notes: "实现+复审修复完成：fail-fast 写守卫、命令分类、静态工厂移除、re-entry rollback-only、事件实例去重、吸收-无进展判别；复审 Approve with comments 0 Critical；EF Core 234/234、MiCake 260/260、构建 0 警告。Follow-up: W-1 样本/README 继承模式仍无写守卫（t6
      迁移）；W-2 DomainEventDispatchTracker 未绑定 UoW 生命周期（建议 t7 前修复）；W-3 follow-up 周期控制流依赖嵌套回调；W-4 池化测试用 InMemory（t7 关系型验收）"
    acceptance:
      - Post-save handlers receive the Added, Modified, or Deleted state captured before persistence
      - Concurrent contexts and shared interceptor/options instances never exchange handlers, snapshots, or event identities
      - Success, pre-save failure, database failure, concurrency failure, cancellation, post-save failure, pool reset, and disposal all release operation state
      - Nested SaveChanges remains in the same transaction, dispatches each event instance at most once, and terminates on quiescence
      - No-progress and MaxSaveCycles paths throw SaveChangesReentryException and leave the UoW rollback-only
      - Save lifecycle concurrency/re-entry tests pass and the EF Core project builds cleanly
    deliverables:
      freshness: current
