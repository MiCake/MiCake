    acceptance:
      - Repository mutations never save or commit independently of the ambient writable UoW
      - DeleteByIdAsync executes audit, soft-delete, domain-event, and UoW lifecycle behavior equivalent to tracked DeleteAsync
      - Physical delete is explicitly named, transaction-bound, and documented as bypassing aggregate lifecycle behavior
      - Detached stale aggregate replacement raises a concurrency conflict instead of silently overwriting detected concurrent changes
      - Paging appends every missing primary-key property after caller sorting and rejects keyless entities
      - Repository tests pass and MiCake plus MiCake.EntityFrameworkCore projects build cleanly
    deliverables:
      freshness: current
