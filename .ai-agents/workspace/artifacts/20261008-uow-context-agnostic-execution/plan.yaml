tasks:
  - id: t1-isolated-execution-api
    title: Deliver ExecuteIsolatedAsync API and shared isolated core
    status: done
    completed_at: 2026-10-08T09:25:13.993Z
    depends_on: []
    project:
      - default
    skill_hint: mvt-implement
    artifacts:
      files:
        - src/framework/MiCake/DDD/Uow/IUnitOfWorkManager.cs
        - src/framework/MiCake/DDD/Uow/IStandaloneUnitOfWorkExecutor.cs
        - src/framework/MiCake/DDD/Uow/Internal/UnitOfWorkManager.cs
        - src/framework/MiCake/DDD/Uow/Internal/StandaloneUnitOfWorkExecutor.cs
        - src/framework/MiCake/DDD/Uow/Internal/IsolatedUowExecution.cs
        - src/tests/MiCake.IntegrationTests/Filters/FilterOrderIntegrationTests.cs
    notes: >
      ADR-012/013/014. Extract the standalone start path from StandaloneUnitOfWorkExecutor.ExecuteCoreAsync into a shared internal helper and re-point the executor at it first; existing standalone
      tests must pass unchanged as the behavior-preservation proof. Add ExecuteIsolatedAsync (void + TResult) to IUnitOfWorkManager with the semantics matrix from design.md Key Interfaces (ambient ->
      requiresNew suspend/restore; no ambient -> standalone root; restore is a no-op without ambient), dispatched in UnitOfWorkManager. Frame push must stay in the synchronous segment (AsyncLocal
      constraint). Rewrite the missing-ambient message to name all three remediation paths; extend the standalone rejection message with ExecuteIsolatedAsync; add seealso XML cross-links across the
      three entries. Update the IUnitOfWorkManager test fake in FilterOrderIntegrationTests.cs within this task to keep the solution compiling. Zero behavior change for existing entries.
    acceptance:
      - dotnet build MiCake.All.sln completes with 0 errors and 0 new warnings
      - IUnitOfWorkManager exposes ExecuteIsolatedAsync and ExecuteIsolatedAsync<TResult> with the semantics matrix documented in XML
      - ExecuteRequiresNewAsync_WithoutOuterUow_ShouldThrow and the standalone rejection tests pass unchanged
      - The missing-ambient message names BeginAsync, ExecuteIsolatedAsync, and IStandaloneUnitOfWorkExecutor remediation paths
      - XML docs of all three execution entries cross-reference each other via seealso
    deliverables:
      freshness: current
  - id: t2-comprehension-guardrail-docs
