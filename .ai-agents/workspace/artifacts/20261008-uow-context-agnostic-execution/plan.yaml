    notes: >
      ADR-015 and analysis R14-R16. README: four-quadrant decision table (boundary frame / shared nested / requiresNew isolated / standalone isolated) keyed on intent and ambient context, plus an
      ExecuteIsolatedAsync section; reposition the strict pair as wiring self-check variants. New guide docs/Background-Jobs-and-Non-HTTP-Hosts.md: Hangfire async job base class (preferred) and
      IServerFilter patterns mirroring UnitOfWorkFilter, entry-agnostic helper shape, AsyncLocal synchronous-segment constraint, opt-out for notification-only jobs, cancellation and retry semantics.
      Migration note in Breaking-Changes-and-Migration-v2.md: two added IUnitOfWorkManager members (source-breaking for implementers, non-breaking for consumers) and ExecuteIsolatedAsync as the
      recommended default entry for isolated write blocks; keep the appended section consistent with the file's existing zh-CN language.
    acceptance:
      - README contains the four-quadrant decision table covering all four execution modes
      - docs/Background-Jobs-and-Non-HTTP-Hosts.md contains both Hangfire reference patterns and the sync-segment constraint note
      - Breaking-Changes-and-Migration-v2.md documents the two added interface members with implementer guidance
      - README positions ExecuteRequiresNewAsync and IStandaloneUnitOfWorkExecutor as wiring self-check variants
    deliverables:
      freshness: current
